<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="af-bridge-module" content="af-bridge-board" />
    <title>API-Football Bridge Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="brand__mark">AF</span>
        <div>
          <h1 class="brand__title">API-Football Bridge</h1>
          <p class="brand__sub">
            <code>apifootball-bridge</code> · 懂球帝 match_id ↔ AF fixture · 北京时间
          </p>
        </div>
      </div>
      <div class="controls">
        <div class="actions">
          <button id="btnRefresh" class="btn btn--ghost" type="button">Sync once</button>
          <button id="btnStart" class="btn btn--primary" type="button">Start watch</button>
          <button id="btnStop" class="btn btn--danger" type="button" disabled>Stop</button>
        </div>
      </div>
    </header>

    <section class="meta" id="meta">
      <div class="pill" id="pillStatus">Idle</div>
      <div class="pill pill--muted" id="pillCount">— mapped</div>
      <div class="pill pill--muted" id="pillUnresolved">Unresolved —</div>
      <div class="pill pill--muted" id="pillBridge">Bridge —</div>
      <div class="pill pill--muted" id="pillStats">—</div>
      <div class="pill pill--muted" id="pillFetched">—</div>
    </section>

    <main class="layout">
      <aside class="league-rail" id="leagueRail" aria-label="Leagues"></aside>
      <section class="board" id="board">
        <div class="empty">打开后只读本地 cache。需要打 AF 时点 Sync once / Start watch。</div>
      </section>
    </main>

    <script src="/src/main.js" type="module"></script>
  </body>
</html>
