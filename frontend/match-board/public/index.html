<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="dqd-module" content="match-board" />
    <title>DQD Match Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="brand__mark">DQD</span>
        <div>
          <h1 class="brand__title">Match Board</h1>
          <p class="brand__sub">Module <code>@dongqiudi/match-board</code> · 时间均为<strong>北京时间</strong></p>
        </div>
      </div>
      <div class="controls">
        <div class="tabs" id="tabs" role="tablist">
          <button class="tab is-active" data-tab="full" type="button">Full</button>
          <button class="tab" data-tab="hot" type="button">Hot</button>
          <button class="tab" data-tab="jingcai" type="button">Jingcai</button>
          <button class="tab" data-tab="beidan" type="button">Beidan</button>
        </div>
        <div class="actions">
          <button id="btnRefresh" class="btn btn--ghost" type="button">Refresh</button>
          <button id="btnStart" class="btn btn--primary" type="button">Start Skill Watch</button>
          <button id="btnStop" class="btn btn--danger" type="button" disabled>Stop</button>
        </div>
      </div>
    </header>

    <section class="meta" id="meta">
      <div class="pill" id="pillStatus">Idle</div>
      <div class="pill pill--muted" id="pillCount">— matches</div>
      <div class="pill pill--muted" id="pillLive">Live —</div>
      <div class="pill pill--muted" id="pillFetched">—</div>
      <div class="pill pill--muted" id="pillTz">UTC+8 北京时间</div>
    </section>

    <main class="layout">
      <aside class="league-rail" id="leagueRail" aria-label="Leagues"></aside>
      <section class="board" id="board">
        <div class="empty" id="empty">Loading matches from skill…</div>
      </section>
    </main>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <script src="/src/main.js" type="module"></script>
  </body>
</html>
